name: Asolaria three-seat activity ledger

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - tools/collect_three_seat_activity.py
      - tracking/seat-registry.json
      - .github/workflows/three-seat-activity.yml

permissions:
  contents: write

concurrency:
  group: asolaria-three-seat-ledger
  cancel-in-progress: false

jobs:
  record-public-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing stones
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture commits, branches, PRs and CI for three seats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/collect_three_seat_activity.py
      - name: Publish snapshot as workflow artifact, even if git cannot push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asolaria-three-seat-ledger-${{ github.run_id }}
          path: |
            tracking/latest.json
            tracking/STATUS.md
            tracking/snapshots/*.json
            tracking/snapshots/*.sha256
          if-no-files-found: warn
      - name: Record append-only snapshot in stones repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking/latest.json tracking/STATUS.md tracking/snapshots/ || true
          if ! git diff --cached --quiet; then
            git commit -m "[tracker] Record three-seat public activity snapshot"
            # Other agents can write while this job is collecting. Incorporate
            # nonconflicting remote commits, never force-push over another seat.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Snapshot committed after reconciliation"
                exit 0
              fi
              echo "Concurrent update detected; retrying with a fresh base"
            done
            echo "Snapshot saved as a workflow artifact; Git push needs review"
            exit 1
          else
            echo "No new observable public repository state"
          fi
