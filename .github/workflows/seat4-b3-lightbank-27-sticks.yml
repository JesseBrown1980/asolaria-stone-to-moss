name: Seat4 B3 colour QR light-bank 27-stick recovery stress test

on:
  pull_request:
    paths:
      - experiments/seat4/PREREG-B3-COLOURQR-LIGHTBANK-20261015.md
      - experiments/seat4/colourqr_lightbank_b3*
      - .github/workflows/seat4-b3-lightbank-27-sticks.yml
  push:
    branches:
      - agent/seat-4/colour-qr-lightbank-b3-20261015
    paths:
      - experiments/seat4/PREREG-B3-COLOURQR-LIGHTBANK-20261015.md
      - experiments/seat4/colourqr_lightbank_b3*
      - .github/workflows/seat4-b3-lightbank-27-sticks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-bank:
    name: B3 RGB QR 27-bank ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct original frozen B2 full state and fault trace on own CI worker
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/B3/input" "$RUNNER_TEMP/B3/banks"
          python experiments/seat4/room04_adversarial_photocycle.py \
            --tick-hbp "$RUNNER_TEMP/B3/input/ticks.hbp" \
            --fault-hbp "$RUNNER_TEMP/B3/input/faults.hbp" \
            --phase-a-hbp "$RUNNER_TEMP/B3/input/original-phaseA.hbp" \
            --receipt "$RUNNER_TEMP/B3/input/receipt.json" > "$RUNNER_TEMP/B3/parent-B2-audit.json"
          cat "$RUNNER_TEMP/B3/parent-B2-audit.json"
      - name: Independently recheck baseline source recovery/loss rank suite
        shell: bash
        run: |
          python experiments/retention/verify_retention.py > "$RUNNER_TEMP/B3/GF2-rank-audit.json"
          cat "$RUNNER_TEMP/B3/GF2-rank-audit.json"
      - name: Write actual four-source bytes into 27 digital RGB memory sticks with two levels of XOR parity
        shell: bash
        run: |
          python experiments/seat4/colourqr_lightbank_b3.py \
            --source-dir "$RUNNER_TEMP/B3/input" \
            --out "$RUNNER_TEMP/B3/banks" > "$RUNNER_TEMP/B3/python-build-audit.json"
          cat "$RUNNER_TEMP/B3/python-build-audit.json"
      - name: Independently reconstruct all indexed RGB packets, erased bank and P projector with Node 22
        shell: bash
        run: |
          node experiments/seat4/colourqr_lightbank_b3_node.js \
            "$RUNNER_TEMP/B3/input" "$RUNNER_TEMP/B3/banks" > "$RUNNER_TEMP/B3/node-reader-audit.json"
          cat "$RUNNER_TEMP/B3/node-reader-audit.json"
      - name: Repeat Python verifier with all already deposited bank records and unchanged sources
        shell: bash
        run: |
          python experiments/seat4/colourqr_lightbank_b3.py \
            --verify-only \
            --source-dir "$RUNNER_TEMP/B3/input" \
            --out "$RUNNER_TEMP/B3/banks" > "$RUNNER_TEMP/B3/python-replay-audit.json"
          cat "$RUNNER_TEMP/B3/python-replay-audit.json"
      - name: Verify exact claims, hashes, original sources, 27 bank cells and all negative controls
        shell: bash
        run: |
          python - "$RUNNER_TEMP/B3" <<'PY'
          import json,hashlib,sys,pathlib
          root=pathlib.Path(sys.argv[1])
          data=json.loads((root/"python-build-audit.json").read_text())
          replay=json.loads((root/"python-replay-audit.json").read_text())
          node=json.loads((root/"node-reader-audit.json").read_text())
          old=json.loads((root/"parent-B2-audit.json").read_text())
          rank=json.loads((root/"GF2-rank-audit.json").read_text())
          manifest=json.loads((root/"banks"/"bank_manifest.json").read_text())
          assert data==replay
          assert data["status"]==node["status"]==rank["status"]==old["status"]=="PASS"
          assert data["source_payload_bytes"]==35607532
          assert data["source_objects_restored"]==4
          assert data["data_banks"]==node["bank_sticks"]==27
          assert data["additional_parity_banks"]==node["parity_sticks"]==1
          assert data["archive_sha256"]==node["archive_sha256"]==manifest["archive_sha256"]
          assert data["qr_indexed_base64_chunks"]==node["indexed_base64_chunks"]
          assert data["rgb_frames_recovered_shuffled"]==node["rgb_frames"]
          assert data["colour_plane_erasure_recoveries"]==node["plane_erasure_roundtrips"]
          assert data["one_whole_bank_erasure_recovered"] and data["one_whole_bank_corruption_detected_and_recovered"]
          assert node["exact_whole_bank_recovery"] and node["exact_corrupted_bank_recovery"]
          assert data["two_whole_bank_erasures"]==data["two_same_frame_colour_erasures"]=="HELD_INSUFFICIENT_EQUATIONS"
          assert node["unrecoverable_two_bank_erasure"]=="HELD"
          assert data["forged_address_rejected"]
          assert data["exact_projector"]["exact_projector_lifts"]==node["independently_verified_projector_samples"]==6561
          assert data["gf2_on_real_trace_memory"]["source_81bit_reconstructions"]==648
          assert rank["rank_cases"]==40 and rank["independent_algorithm_parity"]
          assert old["site_tick_checks"]==349920 and old["rejected_fault_cases"]==1296
          assert old["phase_a_sha256"]=="de2c346a92e626403cc5c59b9ffa688d050163fbb48ab8b1cb6a4cde795b0a8b"
          assert not data["physical_optical_storage_measured"] and not node["camera_or_photon_readout"]
          assert not data["qr_raster_or_camera_decoding"]
          checksum=(root/"banks"/"SHA256SUMS").read_bytes()
          assert b"\r" not in checksum
          print("SEAT4_B3_LIGHTBANK_27_EXACT_MEMORY_PASS",data["archive_sha256"])
          print("SEAT4_B3_MANIFEST_SHA",hashlib.sha256(checksum).hexdigest())
          PY
      - name: Upload actual recovered digital bank bytes, typed source archive and SHA manifests
        uses: actions/upload-artifact@v4
        with:
          name: seat4-b3-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/B3/banks/*
            ${{ runner.temp }}/B3/*audit.json
          if-no-files-found: error
          retention-days: 90
