name: Seat 4 N-Nest corrective agent and watcher gates

on:
  push:
    branches:
      - main
      - agent/seat-4/nnest-corrective-gate-20261015
    paths:
      - experiments/seat4/nnest_wave_gate.py
      - experiments/seat1/TRIAD-27-CHALLENGE-20261014.json
      - experiments/seat1/triad_27_*
      - experiments/seat4/seat1_original_triad_replay.py
      - stones/2026-10-15-rainbow81/seat4-nnest-wave-27*
      - .github/workflows/seat4-nnest-corrective.yml
  pull_request:
    paths:
      - experiments/seat4/nnest_wave_gate.py
      - experiments/seat1/TRIAD-27-CHALLENGE-20261014.json
      - experiments/seat1/triad_27_*
      - experiments/seat4/seat1_original_triad_replay.py
      - stones/2026-10-15-rainbow81/seat4-nnest-wave-27*
      - .github/workflows/seat4-nnest-corrective.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-corrective-gate:
    name: Nested agent and watcher ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout EXACT N-Nest source repository at pinned commit
        uses: actions/checkout@v4
        with:
          repository: JesseBrown1980/N-Nest-Prime-INFINITE-SELF-REFLECT-AGENTS-NESTED
          ref: 307903651f56e8a28ef98ca36aef22ee8cda935c
          path: nnest-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original N-Nest depth3 and prime-depth7, then 27-wave nested watcher/correction gates
        shell: bash
        run: |
          python experiments/seat4/nnest_wave_gate.py --nnest nnest-upstream --receipt "$RUNNER_TEMP/seat4-nnest.json" > "$RUNNER_TEMP/seat4-nnest.stdout.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); assert a==b; assert a['gate_verdict']=='MEASURED_PASS'; assert a['nested']['leaves']==27; assert a['nested']['nodes']==40; assert a['nested']['tampered_wave_13_rejected']" "$RUNNER_TEMP/seat4-nnest.json" "$RUNNER_TEMP/seat4-nnest.stdout.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); assert all(x['root_blocked'] and x['at_depth_detected'] for x in a['nested']['injected_node_faults']); assert all(x['clean_tree']=='MEASURED_PASS' for x in a['nnest_upstream']['original_script_results']); assert a['physical_host_independence']=='NOT_MEASURED'" "$RUNNER_TEMP/seat4-nnest.json"
          python -c "import hashlib,sys; p=sys.argv[1]; print('SEAT4_NNEST_RECEIPT_SHA256='+hashlib.sha256(open(p,'rb').read()).hexdigest())" "$RUNNER_TEMP/seat4-nnest.json"
      - name: Store timestamp-independent nested verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: seat4-nnest-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/seat4-nnest.json
          retention-days: 30
