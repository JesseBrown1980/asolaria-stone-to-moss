name: Seat 4 N-Nest corrective agent and watcher gates

on:
  push:
    branches:
      - main
      - agent/seat-4/nnest-corrective-gate-20261015
    paths:
      - experiments/seat4/nnest_wave_gate.py
      - experiments/seat1/TRIAD-27-CHALLENGE-20261014.json
      - experiments/seat1/triad_27_*
      - experiments/seat4/seat1_original_triad_replay.py
      - stones/2026-10-15-rainbow81/seat4-nnest-wave-27*
      - .github/workflows/seat4-nnest-corrective.yml
  pull_request:
    paths:
      - experiments/seat4/nnest_wave_gate.py
      - experiments/seat1/TRIAD-27-CHALLENGE-20261014.json
      - experiments/seat1/triad_27_*
      - experiments/seat4/seat1_original_triad_replay.py
      - stones/2026-10-15-rainbow81/seat4-nnest-wave-27*
      - .github/workflows/seat4-nnest-corrective.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-corrective-gate:
    name: Nested agent and watcher ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout EXACT N-Nest source repository at pinned commit
        uses: actions/checkout@v4
        with:
          repository: JesseBrown1980/N-Nest-Prime-INFINITE-SELF-REFLECT-AGENTS-NESTED
          ref: 307903651f56e8a28ef98ca36aef22ee8cda935c
          path: nnest-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original N-Nest depth3 and prime-depth7, then 27-wave nested watcher/correction gates
        shell: bash
        run: |
          python experiments/seat4/nnest_wave_gate.py --nnest nnest-upstream --receipt "$RUNNER_TEMP/seat4-nnest.json" > "$RUNNER_TEMP/seat4-nnest.stdout.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); assert a==b; assert a['gate_verdict']=='MEASURED_PASS'; assert a['nested']['leaves']==27; assert a['nested']['nodes']==40; assert a['nested']['tampered_wave_13_rejected']" "$RUNNER_TEMP/seat4-nnest.json" "$RUNNER_TEMP/seat4-nnest.stdout.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); assert all(x['root_blocked'] and x['at_depth_detected'] for x in a['nested']['injected_node_faults']); assert all(x['clean_tree']=='MEASURED_PASS' for x in a['nnest_upstream']['original_script_results']); assert a['physical_host_independence']=='NOT_MEASURED'" "$RUNNER_TEMP/seat4-nnest.json"
          python -c "import hashlib,sys; p=sys.argv[1]; print('SEAT4_NNEST_RECEIPT_SHA256='+hashlib.sha256(open(p,'rb').read()).hexdigest())" "$RUNNER_TEMP/seat4-nnest.json"
          python - "$RUNNER_TEMP/seat4-nnest.json" stones/2026-10-15-rainbow81/seat4-nnest-wave-27.json <<'PY'
          import hashlib,json,pathlib,sys
          actual=pathlib.Path(sys.argv[1]).read_bytes()
          sealed=pathlib.Path(sys.argv[2]).read_bytes()
          expected='f54f7d978ab63206d4b7c6c0135f0661b6486387714d30b610c9437db2e9c0bb'
          if actual!=sealed:
              for i,(a,b) in enumerate(zip(actual,sealed)):
                  if a!=b:
                      print("SEAT4_RECEIPT_FIRST_DIFFERENCE",i,repr(actual[max(0,i-50):i+90]),repr(sealed[max(0,i-50):i+90]))
                      break
          assert actual==sealed, "N-Nest receipt differs from independently sealed first positive run"
          assert hashlib.sha256(actual).hexdigest()==expected
          sidecar=pathlib.Path(sys.argv[2]+'.sha256').read_text('ascii').split()
          assert sidecar==[expected,pathlib.Path(sys.argv[2]).name]
          obj=json.loads(actual)
          assert obj['physical_host_independence']=='NOT_MEASURED'
          assert obj['nested']['human_scale_authorization']=='NOT_REQUESTED'
          print('SEAT4_NNEST_REPRODUCIBLE_SEAL_PASS',expected)
          PY
      - name: Independently verify which laws preserve source information and which need retained bits
        shell: bash
        run: |
          python experiments/seat4/verify_minimal_recovery.py > "$RUNNER_TEMP/seat4-inverse.json"
          python - "$RUNNER_TEMP/seat4-inverse.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v["status"]=="PASS"
          assert v["roundtrips"]==8440
          assert v["full_recovery_without_extra_bits"]==2532
          assert v["full_recovery_with_minimal_sidebits"]==5908
          assert v["constructed_nonzero_kernel_collisions"]==36
          assert v["physical_machine_independence"]=="UNVERIFIED"
          print("NNEST_INVERSE_RECOVERABILITY_PASS",v["canonical_trace_sha256"])
          PY
      - name: Store timestamp-independent nested verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: seat4-nnest-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/seat4-nnest.json
            ${{ runner.temp }}/seat4-inverse.json
          retention-days: 30
