name: Seat 4 Rainbow81 independent parity and signed receipt

on:
  push:
    branches:
      - agent/seat-4/cross-host-rainbow81-20261014
    paths:
      - experiments/seat4/**
      - tracking/checkins/seat-4/**
      - stones/2026-10-14-rainbow81/seat-4-20261014-readiness*
      - .github/workflows/seat4-rainbow81-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seat4-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Ed25519 verifier
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<49'
      - name: Check signed check-in, signed receipt, hashes, algorithms and wrong-seed control
        run: python experiments/seat4/verify_seat4.py
