name: Independently verify signed Seat 4 precommit

on:
  push:
    branches:
      - audit/seat4-signature-verification-20261014
    paths:
      - physical/verify_seat4_public_precommit.py
      - .github/workflows/audit-seat4-ed25519-20261014.yml
      - stones/2026-10-14-rainbow81/stone-seat4-public-precommit-audit-20261014.*
  pull_request:
    paths:
      - physical/verify_seat4_public_precommit.py
      - .github/workflows/audit-seat4-ed25519-20261014.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install independent Ed25519 verification dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42'
      - name: Verify pinned Seat 4 Git blobs and signature tamper control
        run: python physical/verify_seat4_public_precommit.py > seat4-audit.json
      - name: Enforce evidence boundaries
        run: |
          python - <<'PY'
          import json
          with open('seat4-audit.json',encoding='utf-8') as f:
              r=json.load(f)
          assert r["signature_checkin_valid"] is True
          assert r["signature_commit_valid"] is True
          assert r["negative_tamper_test_rejected"] is True
          assert r["physical_independence_verified"] is False
          assert r["coordinator_challenge_issued"] is False
          print("ED25519_SIGNATURES_VERIFIED - no physical host attestation")
          PY
      - name: Verify HBP and HBI audit stone checksums
        run: |
          cd stones/2026-10-14-rainbow81
          sha256sum -c stone-seat4-public-precommit-audit-20261014.hbp.sha256
          sha256sum -c stone-seat4-public-precommit-audit-20261014.hbi.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: seat4-pinned-ed25519-audit-python-${{ matrix.python }}
          path: seat4-audit.json
