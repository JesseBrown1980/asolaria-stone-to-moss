name: Seat4 Room04 independent photocycle watcher and HALT

on:
  pull_request:
    paths:
      - experiments/seat4/PREREG-ROOM04-PHOTOCYCLE-WATCHER-B2-20261015.md
      - experiments/seat4/room04_*
      - .github/workflows/seat4-room04-adversarial-photocycle.yml
  push:
    branches:
      - agent/seat-4/room04-adversarial-photocycle-20261015
    paths:
      - experiments/seat4/PREREG-ROOM04-PHOTOCYCLE-WATCHER-B2-20261015.md
      - experiments/seat4/room04_*
      - .github/workflows/seat4-room04-adversarial-photocycle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-watcher:
    name: Room04 ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.13']
    steps:
      - name: Checkout current room source and preregistration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch exact frozen Seat1 PR50 source (do not change)
        uses: actions/checkout@v4
        with:
          repository: JesseBrown1980/asolaria-stone-to-moss
          ref: dd5e47db9522141de3949a23759a5d647ecdafbd
          path: pinned-seat1-photocycle
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original Seat1 producer bytes and replay 8748 canonical wave snapshots
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/room04"
          python experiments/seat4/verify_seat1_optophotocycle_peer.py --seat1 pinned-seat1-photocycle --receipt "$RUNNER_TEMP/room04/phaseA-peer-receipt.json" > "$RUNNER_TEMP/room04/phaseA-peer-audit.json"
      - name: Execute Seat4 independent watcher and 1296 planted faults
        shell: bash
        run: |
          python experiments/seat4/room04_adversarial_photocycle.py \
            --tick-hbp "$RUNNER_TEMP/room04/ticks.hbp" \
            --fault-hbp "$RUNNER_TEMP/room04/faults.hbp" \
            --phase-a-hbp "$RUNNER_TEMP/room04/original-phaseA.hbp" \
            --receipt "$RUNNER_TEMP/room04/receipt.json" > "$RUNNER_TEMP/room04/python-audit.json"
          cat "$RUNNER_TEMP/room04/python-audit.json"
      - name: Independently replay EVERY site tick with Node and audit the actual fault ledger
        shell: bash
        run: |
          node experiments/seat4/room04_independent_node_watcher.js \
            "$RUNNER_TEMP/room04/ticks.hbp" \
            "$RUNNER_TEMP/room04/faults.hbp" \
            "$RUNNER_TEMP/room04/original-phaseA.hbp" \
            "$RUNNER_TEMP/room04/receipt.json" > "$RUNNER_TEMP/room04/node-audit.json"
          cat "$RUNNER_TEMP/room04/node-audit.json"
      - name: Recheck mathematical reversible/lossy classification (40 independent GF2 cases)
        shell: bash
        run: |
          python experiments/retention/verify_retention.py > "$RUNNER_TEMP/room04/retention-audit.json"
          cat "$RUNNER_TEMP/room04/retention-audit.json"
      - name: Package a genuinely offline executable source and evidence capsule
        shell: bash
        run: |
          python - "$RUNNER_TEMP/room04" <<'PY'
          from pathlib import Path
          import shutil,sys
          bundle=Path(sys.argv[1])
          sources=[
              "experiments/seat4/room04_adversarial_photocycle.py",
              "experiments/seat4/room04_independent_node_watcher.js",
              "experiments/seat4/room04_offline_verify.py",
              "experiments/seat4/PREREG-ROOM04-PHOTOCYCLE-WATCHER-B2-20261015.md",
              "experiments/retention/retention_poly.py",
              "experiments/retention/retention_matrix.js",
              "experiments/retention/verify_retention.py",
              "experiments/seat1/TRIAD-27-CHALLENGE-20261014.json",
              "stones/2026-10-14-rainbow81/retention-81-rank40.tsv",
              "stones/2026-10-14-rainbow81/retention-81-rank40.tsv.sha256",
              "stones/2026-10-14-rainbow81/retention-81-rank40.json",
              "stones/2026-10-14-rainbow81/retention-81-rank40.json.sha256",
              "stones/2026-10-15-rainbow81/seat4-room04-b2-watchers.json",
              "stones/2026-10-15-rainbow81/seat4-room04-b2-watchers.json.sha256",
          ]
          original=[
              "opto_gate.py","opto_gate_node.js","verify_opto.py",
              "PREREG-LIGHT-GATED-IDENTITY-1080.md",
          ]
          for rel in sources:
              out=bundle/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(rel,out)
          for name in original:
              rel=Path("experiments/seat1/optogenetics")/name
              out=bundle/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(Path("pinned-seat1-photocycle")/rel,out)
          (bundle/"README.md").write_text(
              "# Seat 4 Room 04 — offline digital photocycle and watcher capsule\n\n"
              "Contains original frozen Seat1 photocycle sources, independent Seat4 "
              "Python+Node source, preregistration, SHA256SUMS, actual full HBP "
              "traces, 1,296 negative fault rows, and 40-case GF(2) retention audit.\n\n"
              "Requirements: Python 3.11+ and Node.js 22+. No cloud, HF token, "
              "Git checkout, physical hardware, external consent, or network.\n\n"
              "From the ZIP extract root, run:\n\n"
              "    python experiments/seat4/room04_offline_verify.py --bundle .\n\n"
              "All light, PID, time, color and state labels are synthetic. "
              "This capsule is not an optogenetic biology measurement.\n",
              encoding="utf-8",newline="\n"
          )
          print("SEAT4_OFFLINE_SOURCE_PACKAGE_STAGED",len(sources)+len(original))
          PY
      - name: Enforce original SHA, all negative controls and science scope, archive SHA256 manifest
        shell: bash
        run: |
          python - "$RUNNER_TEMP/room04" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          # The model/trace fields were identical on Windows and Ubuntu, but
          # Python redirected stdout used CRLF on Windows. Canonicalize only
          # audit JSON logs; the frozen source and all HBP are never modified.
          for audit in root.glob("*audit.json"):
              audit.write_bytes(audit.read_bytes().replace(b"\r\n",b"\n"))
          receipt=json.loads((root/"receipt.json").read_text())
          p=json.loads((root/"python-audit.json").read_text())
          n=json.loads((root/"node-audit.json").read_text())
          peer=json.loads((root/"phaseA-peer-audit.json").read_text())
          rank=json.loads((root/"retention-audit.json").read_text())
          frozen="de2c346a92e626403cc5c59b9ffa688d050163fbb48ab8b1cb6a4cde795b0a8b"
          assert p["status"]==n["status"]==peer["status"]==rank["status"]=="PASS"
          assert p["site_tick_checks"]==n["independent_node_tick_matches"]==349920
          assert p["rejected_fault_cases"]==n["rejected_fault_rows"]==1296
          assert receipt["b2_clean_checkpoints_accepted"]==n["accepted_genuine_checkpoints"]==108
          assert receipt["frozen_phase_a_sha256"]==n["original_phase_a_sha256"]==peer["hbp_sha256"]==frozen
          assert rank["rank_cases"]==40 and rank["negative_controls"]=="PASS"
          assert not receipt["external_authorization_granted"]
          assert not receipt["independent_physical_source_authenticated"]
          assert not receipt["physical_light_or_biology_measured"]
          assert receipt["coherent_fake_source_plus_fake_watcher_without_anchor"]=="PROVENANCE_HOLD"
          stone=pathlib.Path("stones/2026-10-15-rainbow81/seat4-room04-b2-watchers.json")
          assert stone.read_bytes()==(root/"receipt.json").read_bytes()
          side=stone.with_name(stone.name+".sha256").read_text("ascii").split()
          assert side==["e63baf8accdfbca43bd23e02b8849fcf312ee904ea3a29e02ab9c11bd8b0dafd",stone.name]
          assert receipt["halt"]["accepted_before_halt"]==17
          assert receipt["halt"]["post_halt_denied"]==64
          assert receipt["halt"]["human_prompts"]==receipt["halt"]["external_privileges_granted"]==0
          # Hash commitments were independently measured from the first
          # successful Ubuntu run and its downloaded raw Actions artifact.
          pinned={
              "ticks.hbp":"2b9575a8d46c2d2f0842d590081641ed2b20daddccc7153107d76efa0d597277",
              "faults.hbp":"ad471bc627451f65d6f26797ddf6c03546ac1f74ab8e3698d9825f1409f9bbb2",
              "original-phaseA.hbp":"de2c346a92e626403cc5c59b9ffa688d050163fbb48ab8b1cb6a4cde795b0a8b",
              "phaseA-peer-receipt.json":"d9b4ac57e6cea5f2fe91473f6593d8d3c5e14c9975b9a279b65af9f9acf539e1",
              "receipt.json":"e63baf8accdfbca43bd23e02b8849fcf312ee904ea3a29e02ab9c11bd8b0dafd",
              "node-audit.json":"07a46050ecc7809fb83f6b16ca93a00f48b1aa3e67f759034ec03bee357e8621",
              "python-audit.json":"8d37e13c5f11e1c90ff8554896e6b70ac63642b2df8da81dad83973c074aefbe",
              "phaseA-peer-audit.json":"343cf71a7719266b065816a2478b0320ac5462dd604958ce3dc546b0e09f770a",
              "retention-audit.json":"4c2cdf1705743c567f09b4a872855ab66a1b3d9d3e75bd7a4f4c5e916fff9b9b",
          }
          for name,expected in pinned.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,("cross-OS artifact drift",name)
          assert b"\r\n" not in (root/"receipt.json").read_bytes()
          manifest=[]
          for path in sorted(root.rglob("*"),key=lambda p:p.relative_to(root).as_posix()):
              if path.is_file():
                  digest=hashlib.sha256(path.read_bytes()).hexdigest()
                  manifest.append(f"{digest}  {path.relative_to(root).as_posix()}\n")
          (root/"SHA256SUMS").write_text("".join(manifest),encoding="ascii",newline="\n")
          print("SEAT4_OFFLINE_CAPSULE_MANIFEST_SHA256",
                hashlib.sha256((root/"SHA256SUMS").read_bytes()).hexdigest())
          print("SEAT4_ROOM04_ACCEPTANCE_PASS: strict software-only watch and HALT, full trace archived")
          PY
      - name: Reproduce entire source-complete capsule OFFLINE with both runtimes
        shell: bash
        run: |
          python experiments/seat4/room04_offline_verify.py --bundle "$RUNNER_TEMP/room04" > "$RUNNER_TEMP/room04-offline-verify.json"
          cat "$RUNNER_TEMP/room04-offline-verify.json"
      - uses: actions/upload-artifact@v4
        with:
          name: seat4-room04-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/room04/*
          if-no-files-found: error
          retention-days: 90
