name: Seat 1 N-Nest Q-PRISM pinned-upstream integration

on:
  push:
    branches:
      - agent/seat-1/nnest-qprism-source-orchestrator-20261015
    paths:
      - experiments/integration/seat1/**
      - .github/workflows/seat1-nnest-qprism-upstream.yml
  pull_request:
    paths:
      - experiments/integration/seat1/**
      - .github/workflows/seat1-nnest-qprism-upstream.yml

permissions:
  contents: read

jobs:
  source-watcher:
    name: pinned-upstream-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Stone-to-Moss integration source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact public N-Nest source commit
        uses: actions/checkout@v4
        with:
          repository: JesseBrown1980/N-Nest-Prime-INFINITE-SELF-REFLECT-AGENTS-NESTED
          ref: 307903651f56e8a28ef98ca36aef22ee8cda935c
          path: external/nnest
          persist-credentials: false
      - name: Checkout exact public Q-PRISM source commit
        uses: actions/checkout@v4
        with:
          repository: JesseBrown1980/Q-PRISM-human-organoid-neural-stream-as-a-high-dimensional-control
          ref: b4a21a25381d6920b7aab92c94c3c3e1420fc9e4
          path: external/qprism
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python package dependencies of the original Q-PRISM simulation
        run: python -m pip install --disable-pip-version-check -r external/qprism/requirements.txt
      - name: Syntax check the Seat 1 integration adapter
        run: python -m py_compile experiments/integration/seat1/upstream_bridge.py
      - name: Run both exact upstream N-Nest verifiers and actual Q-PRISM, with watched leaf and negative controls
        run: python experiments/integration/seat1/upstream_bridge.py run --nn external/nnest --q external/qprism --out seat1-evidence
      - name: Verify sealed HBP HBI JSON and original three SHA256 sidecars (fail closed)
        run: python experiments/integration/seat1/upstream_bridge.py audit --out seat1-evidence
      - name: Preserve source-bound run-specific receipts, not static historical hashes
        uses: actions/upload-artifact@v4
        with:
          name: seat1-nnest-qprism-${{ matrix.os }}
          if-no-files-found: error
          path: |
            seat1-evidence/seat1-source-bridge.json
            seat1-evidence/seat1-source-bridge.json.sha256
            seat1-evidence/seat1-source-bridge.hbp
            seat1-evidence/seat1-source-bridge.hbp.sha256
            seat1-evidence/seat1-source-bridge.hbi
            seat1-evidence/seat1-source-bridge.hbi.sha256
