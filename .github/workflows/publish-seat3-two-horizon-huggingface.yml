name: Publish Seat 3 two-horizon stones to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - tools/publish_seat3_two_horizon_to_hf.py
      - experiments/seat3/two_horizon_matrix.py
      - experiments/seat3/two_horizon_polynomial.js
      - stones/2026-10-14-rainbow81/seat-3-two-horizon-9720-control.json
      - .github/workflows/publish-seat3-two-horizon-huggingface.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish only if protected HF_TOKEN secret is configured"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: seat3-two-horizon-hf-mirror
  cancel-in-progress: false
jobs:
  stage-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate 9720 model states with two independent solvers
        env:
          SEAT3_HF_EXPORT_DIR: ${{ runner.temp }}/seat3-hf-ready
        run: python tools/publish_seat3_two_horizon_to_hf.py
      - name: Preserve immutable staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seat3-two-horizon-hf-ready
          path: ${{ runner.temp }}/seat3-hf-ready/
          retention-days: 30
  publish-and-readback:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: stage-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the trusted Hugging Face publishing library
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.36,<2'
      - name: Require protected Hugging Face write credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Hugging Face upload NOT performed; configure protected Actions repository secret named HF_TOKEN."
            exit 1
          fi
          echo "Protected HF_TOKEN is configured; the value is not printed."
      - name: Publish HBP, source, manifest and read back every SHA-256
        env:
          SEAT3_HF_PUBLISH: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python tools/publish_seat3_two_horizon_to_hf.py
