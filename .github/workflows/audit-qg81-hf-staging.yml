name: Audit QG81 Hugging Face staging without credential

on:
  push:
    branches:
      - agent/seat-3/2026-10-14-quantum-gravity-gates
    paths:
      - tools/publish_quantum_gravity_to_hf.py
      - .github/workflows/audit-qg81-hf-staging.yml
  pull_request:
    paths:
      - tools/publish_quantum_gravity_to_hf.py
      - .github/workflows/audit-qg81-hf-staging.yml

permissions:
  contents: read

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.36,<2'
      - name: Verify published-package inputs, SHA256 and manifests
        env:
          HF_PUBLISH_DRY_RUN: '1'
        run: python tools/publish_quantum_gravity_to_hf.py
