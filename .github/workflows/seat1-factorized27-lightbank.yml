name: Seat1 factorized 27-sector lightbank resolver - source-root and alias replay

on:
  push:
    branches:
      - agent/seat-1/factorized-rainbow27-lightbank-20261015
    paths:
      - experiments/seat1/factorized27/**
      - .github/workflows/seat1-factorized27-lightbank.yml
  pull_request:
    paths:
      - experiments/seat1/factorized27/**
      - .github/workflows/seat1-factorized27-lightbank.yml

permissions:
  contents: read

jobs:
  factorized-replay:
    name: Factor27-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install original source QR decoder on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libzbar0
      - name: Install open source QR and pixel packages (no paid compute)
        run: python -m pip install --disable-pip-version-check "qrcode>=7.4,<9" "Pillow>=10,<13" "pyzbar==0.1.9"
      - name: Produce original 81-memory pixel QR evidence
        run: python experiments/seat1/round2/lightbank_81.py original-evidence
      - name: Verify original 81-memory QR and photocycle
        run: node experiments/seat1/round2/verify_lightbank_81.js original-evidence
      - name: Produce unchanged seven-band 567-entry bank and HBI
        run: python experiments/seat1/rainbow7/rainbow7_bank.py original-evidence rainbow-evidence
      - name: Verify original 567-entry stored memory content
        run: node experiments/seat1/rainbow7/verify_rainbow7_bank.js original-evidence rainbow-evidence
      - name: Reproduce historical expanded 15309-row HBI as test oracle only
        run: python experiments/seat1/ordered27/ordered27_index.py original-evidence rainbow-evidence expanded-evidence
      - name: Run Python lazy resolver and active negative controls
        run: python experiments/seat1/factorized27/factorized27.py original-evidence rainbow-evidence python-evidence
      - name: Run independent Node lazy resolver and active negative controls
        run: node experiments/seat1/factorized27/factorized27_node.js original-evidence rainbow-evidence node-evidence
      - name: Require Python-Node exact compact HBP/JSON and original source pins
        run: python experiments/seat1/factorized27/verify_factorized_release.py .
      - uses: actions/upload-artifact@v4
        with:
          name: factorized27-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            original-evidence/lightbank-memories.json
            rainbow-evidence/rainbow7-bank.jsonl
            rainbow-evidence/rainbow7-index.hbi
            expanded-evidence/ordered27-rainbow7-index.hbi
            python-evidence/factorized27.json
            python-evidence/factorized27.hbp
            python-evidence/*.sha256
            node-evidence/factorized27.json
            node-evidence/factorized27.hbp
            node-evidence/*.sha256
  cross-os-exact:
    name: Factor27 source-pinned Ubuntu and Windows exact parity
    needs: factorized-replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: factorized27-ubuntu-latest
          path: from-ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: factorized27-windows-latest
          path: from-windows
      - name: Verify both full source pins and both generated receipts byte for byte
        run: python experiments/seat1/factorized27/verify_factorized_release.py from-ubuntu from-windows
