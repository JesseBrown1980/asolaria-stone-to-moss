name: Publish verified QG81 stones to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - tools/publish_quantum_gravity_to_hf.py
      - .github/workflows/publish-qg81-huggingface.yml
      - stones/2026-10-14-rainbow81/quantum-gravity-81-*
      - stones/2026-10-14-rainbow81/stone-seat3-81-quantum-gravity-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asolaria-quantum-gravity-hf-deposit
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and sealed receipts
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require a protected write-capable Hugging Face credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Hugging Face publishing NOT done: add a write-capable HF_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Credential configured; token value is not displayed."
      - name: Install Hub publishing client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.36,<2'
      - name: Publish and download-verify both destinations
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/publish_quantum_gravity_to_hf.py
