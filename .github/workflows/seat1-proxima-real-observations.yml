name: Seat1 Proxima Real Observatory Source Intake
on:
  push:
    branches: [agent/seat1/proxima-rust181-20261015]
    paths:
      - 'experiments/seat1/proxima-rust181/real_observations/**'
      - '.github/workflows/seat1-proxima-real-observations.yml'
  pull_request:
    paths:
      - 'experiments/seat1/proxima-rust181/real_observations/**'
      - '.github/workflows/seat1-proxima-real-observations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-raw-intake:
    name: Source HTTPS 722 RV 2212 flux Hubble hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve and validate actual dated astronomical source bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/seat1/proxima-rust181/real_observations/acquire.py
          test "$(wc -l < real_observations/output/spec.dat)" -eq 722
          test "$(wc -l < real_observations/output/photo.dat)" -eq 2212
          (cd real_observations/output && sha256sum spec.dat photo.dat ORIGINAL-SOURCE-MANIFEST.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: original-real-observations-proxima
          path: real_observations/output/*
          if-no-files-found: error
